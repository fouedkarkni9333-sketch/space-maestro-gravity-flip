<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Space Maestro: Gravity Flip</title>
    <!-- MediaPipe FaceMesh & Camera Utils -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="game-header">
        <h1>Space Maestro: Gravity Flip</h1>
    </header>

    <div id="game-container">
        <!-- UI Overlay -->
        <div class="ui-overlay">
            <div class="score-box">Score: <span id="score-val">0</span></div>
            <button class="btn-action" onclick="toggleRecording()">Record Clip</button>
        </div>

        <!-- Game Over Screen -->
        <div id="game-over-screen">
            <h2>Game Over</h2>
            <p>Final Score: <span id="final-score">0</span></p>
            <button class="btn-main" onclick="restartGame()">Play Again</button>
            <br>
            <button class="btn-main btn-secondary" onclick="downloadRecording()">Download Video</button>
        </div>

        <!-- Hidden Video for Camera Feed & Responsive Canvas -->
        <video id="video-element" playsinline></video>
        <canvas id="gameCanvas"></canvas>
    </div>

    <script src="script.js"></script>
</body>
</html>
