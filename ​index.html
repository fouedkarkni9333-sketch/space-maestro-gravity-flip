<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Space Maestro: Gravity Flip</title>
    <link rel="stylesheet" href="style.css">
    <!-- استدعاء مكتبة MediaPipe لتتبع الوجه من خلال المتصفح مباشرة -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js" crossorigin="anonymous"></script>
</head>
<body>

    <div class="game-container">
        <!-- شاشة البداية أو واجهة اللعبة -->
        <header>
            <h1>Space Maestro</h1>
            <p>مدير السيرك الفضائي الطائر</p>
        </header>

        <div class="view-port">
            <!-- عنصر لعرض كاميرا الهاتف -->
            <video id="webcam" autoplay playsinline muted></video>
            <!-- لوحة الرسم الخاصة باللعبة فوق الكاميرا -->
            <canvas id="gameCanvas"></canvas>
        </div>

        <div class="ui-layer">
            <div id="score">النقاط: 0</div>
            <button id="startBtn">ابدأ اللعبة</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
